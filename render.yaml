databases:
  - name: stock-market-db
    databaseName: stock_market
    user: stock_user
    plan: free
    region: singapore

services:
  - type: web
    name: stock-market-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build:packages && npm --workspace=@stock-market/api run build
    startCommand: npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss && npx tsx apps/api/prisma/seed.ts && node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: stock-market-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: LICENSE_HMAC_SECRET
        generateValue: true

