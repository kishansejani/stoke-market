version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stoke_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: stock_market
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stoke_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: stoke_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "file:./dev.db"
      JWT_ACCESS_SECRET: "production_secret_key_access_2026_xyz"
      JWT_REFRESH_SECRET: "production_secret_key_refresh_2026_xyz"
      LICENSE_HMAC_SECRET: "crypto_hmac_master_secret_2026"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: stoke_web
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

